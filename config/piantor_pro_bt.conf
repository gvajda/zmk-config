# Keyboard name shown to USB and Bluetooth hosts (max. 16 characters).
CONFIG_ZMK_KEYBOARD_NAME="Piantor Pro BT"

# Deep sleep after 2 hours idle (ZMK default is 15 min). Waking from deep sleep
# means a full BLE reconnect (several seconds); idle-but-awake costs ~1 mA, so
# the longer timeout trades some battery for instant wake. Applies to both halves.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

# RGB underglow is available but OFF at boot — RGB drains the battery to a few
# hours (per the keyboard guide). Toggle it on from the kbd layer (RGBtog).
# Brightness/hue/sat below are the defaults after a settings reset; the runtime
# state set via &rgb_ug is persisted to flash and wins afterwards.
#
# AUTO_OFF_IDLE is a battery guard, not a convenience: the 21 WS2812 LEDs per
# half sit behind EXT_POWER, which ZMK enables by default at boot (and after a
# settings_reset). With underglow merely "off" the strip stays powered and the
# LEDs draw ~15 mA of quiescent current while dark. ZMK only cuts EXT_POWER
# inside rgb_underglow_off(), and AUTO_OFF_IDLE calls that on every idle
# transition (CONFIG_ZMK_IDLE_TIMEOUT, 30 s default) regardless of RGB state,
# so the strip is unpowered within 30 s of boot and stays so. Same setting
# Keebart ships upstream.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=20
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=200
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=98

# Per-half battery reporting. By default only the central (left) half exposes a
# BLE Battery Service, so menu bar apps show a single level regardless of their
# L/R labels. FETCHING makes the central read the peripheral's level over the
# split link; PROXY exposes it to the host as a second Battery Service instance.
# Host support for multiple battery levels is undefined — macOS surfaces only
# the primary, a dedicated app (ZMK Battery Bar / zmk-battery-center) reads both.
CONFIG_BT_BAS=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
